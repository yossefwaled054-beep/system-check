<!doctype html>
<html lang="ar" dir="rtl">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System</title>
<style>
html,body{margin:0;background:#000;color:#0f0;font-family:monospace;height:100%;overflow:hidden}
#x{padding:35px;font-size:20px}
.flash{animation:f .15s 3}
@keyframes f{50%{background:#fff;color:#000}}
.big{font-size:42px;color:red;text-align:center;margin-top:25vh}
</style>
<div id="x">Initializing system...<br><br>Checking device...<br><br>
<span id="p">0%</span></div>
<script>
let n=0,p=document.getElementById("p");
let t=setInterval(()=>{
 n+=10;p.textContent=n+"%";
 if(n>=100){
  clearInterval(t);
  document.body.className="flash";
  document.body.innerHTML='<div class="big">⚠️ SYSTEM ALERT ⚠️<br><br>😂</div>';
  setTimeout(()=>document.body.innerHTML='<div class="big">مقلب 😂</div>',900);
 }
},180);
</script>
