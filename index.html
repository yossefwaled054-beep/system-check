<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YOUSSEF // V10 ULTRA</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#02030a;
  color:#dffcff;
  font-family:monospace;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,220,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
  animation:grid 8s linear infinite;
}
@keyframes grid{to{background-position:32px 32px}}

.app{
  position:relative;
  width:100%;
  height:100%;
  max-width:430px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,#08213a 0,#030610 38%,#010207 80%);
}

.scanline{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:#00eaff;
  box-shadow:0 0 18px #00eaff;
  opacity:.35;
  animation:scan 3s linear infinite;
  z-index:20;
}
@keyframes scan{
  from{top:-5%}
  to{top:105%}
}

.top{
  position:absolute;
  top:16px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:#5cecff;
  letter-spacing:2px;
  z-index:5;
}

.core{
  position:absolute;
  top:105px;
  left:50%;
  transform:translateX(-50%);
  width:245px;
  height:245px;
  border:1px solid #00eaff88;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 35px #00eaff22,inset 0 0 30px #00eaff15;
}

.core:before,.core:after{
  content:"";
  position:absolute;
  border:1px solid #7b4dff55;
  border-radius:50%;
}
.core:before{inset:22px}
.core:after{inset:52px}

.radar{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 72%,#00eaff55 76%,transparent 81%);
  animation:spin 2.5s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.cross{
  position:absolute;
  width:100%;
  height:1px;
  background:#00eaff44;
}
.cross.v{
  width:1px;
  height:100%;
}

.brand{
  position:relative;
  z-index:2;
  text-align:center;
}

.brand small{
  display:block;
  color:#8c7cff;
  font-size:8px;
  letter-spacing:4px;
  margin-bottom:8px;
}

.brand h1{
  margin:0;
  font-size:39px;
  letter-spacing:5px;
  color:#fff;
  text-shadow:
    0 0 5px #00eaff,
    0 0 18px #00eaff,
    0 0 35px #7b4dff;
  animation:pulse 1.4s ease-in-out infinite alternate;
}

@keyframes pulse{
  from{filter:brightness(.9)}
  to{filter:brightness(1.35)}
}

.hud{
  position:absolute;
  top:375px;
  left:15px;
  right:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.card{
  padding:10px;
  border:1px solid #123b4a;
  border-radius:10px;
  background:#06101a99;
  box-shadow:inset 0 0 15px #00eaff08;
}

.card .title{
  color:#668895;
  font-size:8px;
  letter-spacing:1px;
}
.value{
  margin-top:5px;
  font-size:17px;
  color:#00eaff;
  text-shadow:0 0 8px #00eaff;
}
.mini{
  height:3px;
  margin-top:7px;
  background:#10202a;
  overflow:hidden;
}
.mini i{
  display:block;
  width:65%;
  height:100%;
  background:linear-gradient(90deg,#00eaff,#8c4dff);
  animation:load 2s infinite alternate;
}
@keyframes load{
  from{width:25%}
  to{width:94%}
}

.terminal{
  position:absolute;
  left:15px;
  right:15px;
  bottom:57px;
  height:115px;
  padding:10px;
  border:1px solid #173746;
  border-radius:10px;
  background:#02060bcc;
  overflow:hidden;
  font-size:8px;
  color:#54ffae;
}

.log{
  margin:3px 0;
  opacity:.8;
}

.log b{color:#00eaff}

.footer{
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  text-align:center;
  color:#344957;
  font-size:7px;
  letter-spacing:2px;
}

.flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:30;
}

.flash.go{animation:flash .35s}
@keyframes flash{
  0%{opacity:0}
  20%{opacity:.9}
  100%{opacity:0}
}

.final{
  position:absolute;
  inset:0;
  background:#010208f7;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.final.show{display:flex}

.final .line{
  width:230px;
  height:1px;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
  margin:18px 0;
}

.final h2{
  margin:0;
  font-size:12px;
  letter-spacing:5px;
  color:#8d83ff;
}

.final .name{
  font-size:55px;
  font-weight:bold;
  letter-spacing:7px;
  color:#fff;
  text-shadow:
    0 0 7px #00eaff,
    0 0 22px #00eaff,
    0 0 45px #7b4dff;
  animation:finalPulse 1s infinite alternate;
}

@keyframes finalPulse{
  from{transform:scale(.96);opacity:.8}
  to{transform:scale(1.04);opacity:1}
}

.final p{
  font-size:9px;
  color:#5f7784;
  letter-spacing:3px;
}

.glitch{
  animation:glitch .12s 5;
}
@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(5px,-2px)}
  50%{transform:translate(-5px,2px)}
  75%{transform:translate(3px,1px)}
  100%{transform:translate(0)}
}
</style>
</head>

<body>

<div class="app" id="app">

<div class="scanline"></div>

<div class="top">
  <span>YOUSSEF // V10</span>
  <span id="clock">00:00:00</span>
</div>

<div class="core" id="core">
  <div class="radar"></div>
  <div class="cross"></div>
  <div class="cross v"></div>

  <div class="brand">
    <small>SYSTEM CORE</small>
    <h1>YOUSSEF</h1>
  </div>
</div>

<div class="hud">

  <div class="card">
    <div class="title">CPU LOAD</div>
    <div class="value" id="cpu">--%</div>
    <div class="mini"><i></i></div>
  </div>

  <div class="card">
    <div class="title">MEMORY</div>
    <div class="value" id="ram">--%</div>
    <div class="mini"><i></i></div>
  </div>

  <div class="card">
    <div class="title">BATTERY</div>
    <div class="value" id="battery">--%</div>
    <div class="mini"><i></i></div>
  </div>

  <div class="card">
    <div class="title">NETWORK</div>
    <div class="value" id="ping">-- ms</div>
    <div class="mini"><i></i></div>
  </div>

</div>

<div class="terminal" id="terminal"></div>

<div class="footer">
  VISUAL SYSTEM SIMULATION // V10 ULTRA
</div>

<div class="flash" id="flash"></div>

<div class="final" id="final">
  <h2>FINAL SYSTEM STATUS</h2>
  <div class="line"></div>
  <div class="name">YOUSSEF</div>
  <div class="line"></div>
  <p>DIAGNOSTIC COMPLETE // SYSTEM VERIFIED</p>
</div>

</div>

<script>
const terminal=document.getElementById("terminal");
const app=document.getElementById("app");
const flash=document.getElementById("flash");
const final=document.getElementById("final");

const messages=[
  "BOOTING YOUSSEF SYSTEM V10...",
  "INITIALIZING CORE ENGINE...",
  "LOADING SECURITY MODULES...",
  "CHECKING SYSTEM INTEGRITY...",
  "ANALYZING PERFORMANCE...",
  "MEMORY MODULE ONLINE...",
  "NETWORK ENGINE ONLINE...",
  "RUNNING FINAL DIAGNOSTIC...",
  "ALL VISUAL MODULES READY..."
];

let index=0;

function log(){
  if(index>=messages.length)return;

  const line=document.createElement("div");
  line.className="log";
  line.innerHTML="<b>[V10]</b> "+messages[index];
  terminal.appendChild(line);

  while(terminal.children.length>9)
    terminal.removeChild(terminal.firstChild);

  index++;

  setTimeout(log,650);
}

function randomize(){
  document.getElementById("cpu").textContent=
    Math.floor(35+Math.random()*60)+"%";

  document.getElementById("ram").textContent=
    Math.floor(40+Math.random()*50)+"%";

  document.getElementById("battery").textContent=
    Math.floor(70+Math.random()*29)+"%";

  document.getElementById("ping").textContent=
    Math.floor(18+Math.random()*55)+" ms";
}

function clock(){
  const d=new Date();
  document.getElementById("clock").textContent=
    d.toLocaleTimeString("en-US",{hour12:false});
}

setInterval(randomize,700);
setInterval(clock,1000);

randomize();
clock();
log();

setTimeout(()=>{
  app.classList.add("glitch");
  flash.classList.add("go");

  setTimeout(()=>{
    app.classList.remove("glitch");
    flash.classList.remove("go");
  },500);
},6500);

setTimeout(()=>{
  final.classList.add("show");
},8200);
</script>

</body>
</html>
