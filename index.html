
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>YOSSEF SYSTEM</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#020403;
    color:#39ff6a;
    font-family:monospace;
}

.login{
    width:90%;
    max-width:430px;
    margin:70px auto;
    padding:30px;
    background:#050b06;
    border:1px solid #39ff6a;
    box-shadow:
        0 0 20px #39ff6a44,
        inset 0 0 20px #39ff6a11;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#39ff6a;
    text-shadow:0 0 15px #39ff6a;
}

.subtitle{
    text-align:center;
    color:#c84cff;
    margin:10px 0 30px;
}

label{
    display:block;
    margin-top:15px;
    color:#7c9482;
}

input{
    width:100%;
    padding:14px;
    margin-top:7px;
    background:#010201;
    color:#39ff6a;
    border:1px solid #164d25;
    outline:none;
    font-family:monospace;
    font-size:16px;
}

input:focus{
    border-color:#39ff6a;
    box-shadow:0 0 10px #39ff6a33;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    background:#39ff6a;
    color:#001b08;
    font-family:monospace;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 15px #39ff6a;
}

#error{
    min-height:22px;
    margin-top:15px;
    text-align:center;
    color:#ff4058;
}

#system{
    display:none;
}

.header{
    padding:15px;
    border-bottom:1px solid #164d25;
    display:flex;
    justify-content:space-between;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:18px;
}

.layout{
    display:grid;
    grid-template-columns:210px 1fr;
    gap:15px;
}

.sidebar{
    background:#050b06;
    border:1px solid #164d25;
    padding:15px;
}

.brand{
    color:#39ff6a;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.menu button{
    background:transparent;
    color:#7d9483;
    border:1px solid transparent;
    text-align:left;
}

.menu button:hover{
    background:#39ff6a;
    color:#001b08;
}

.content{
    min-width:0;
}

.cards{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);
    gap:10px;
}

.card{
    padding:16px;
    background:#050b06;
    border:1px solid #164d25;
}

.small{
    color:#718078;
    font-size:11px;
}

.number{
    margin-top:8px;
    font-size:25px;
    font-weight:bold;
}

.green{
    color:#39ff6a;
}

.blue{
    color:#25cfff;
}

.purple{
    color:#d44cff;
}

.yellow{
    color:#ffd447;
}

.panel{
    margin-top:15px;
    padding:18px;
    background:#050b06;
    border:1px solid #164d25;
}

.terminal{
    background:#010201;
    border:1px solid #123d1d;
    padding:15px;
    color:#a5ffb7;
    min-height:250px;
    white-space:pre-wrap;
    overflow:auto;
}

.scanbar{
    height:20px;
    margin-top:15px;
    background:#07130a;
    border:1px solid #164d25;
}

.scanfill{
    width:0%;
    height:100%;
    background:#39ff6a;
    box-shadow:0 0 10px #39ff6a;
}

.status{
    padding:12px;
    margin-top:10px;
    border:1px solid #164d25;
    display:flex;
    justify-content:space-between;
}

.online{
    color:#39ff6a;
}

.disabled{
    color:#ff4058;
}

@media(max-width:700px){

    .layout{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:420px){

    .cards{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login"
class="login">

<div class="logo">
YOSSEF SYSTEM
</div>

<div class="subtitle">
CYBER CONTROL v5.0
</div>


<label>
USERNAME
</label>

<input
id="username"
placeholder="Enter username"
autocomplete="off"
>


<label>
PASSWORD
</label>

<input
id="password"
type="password"
placeholder="Enter password"
autocomplete="off"
>


<button onclick="login()">
&gt; ACCESS SYSTEM
</button>


<button
onclick="showPassword()"
style="
background:#102417;
color:#39ff6a;
">

SHOW / HIDE PASSWORD

</button>


<div id="error">
</div>

</div>


<!-- SYSTEM -->

<div id="system">


<div class="header">

<b>
&gt;_ YOSSEF SYSTEM
</b>

<span>
● SIMULATION MODE
</span>

</div>


<div class="container">

<div class="layout">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="brand">
YOSSEF
</div>


<div class="menu">

<button onclick="dashboard()">
⌂ DASHBOARD
</button>

<button onclick="terminal()">
&gt;_ TERMINAL
</button>

<button onclick="network()">
◈ NETWORK
</button>

<button onclick="scan()">
▣ SCAN
</button>

<button onclick="security()">
🔐 SECURITY
</button>

<button onclick="systemInfo()">
⚙ SYSTEM INFO
</button>

<button
onclick="logout()"
style="color:#ff4058;">

⇥ LOGOUT

</button>

</div>

</div>


<!-- CONTENT -->

<div id="content"
class="content">

</div>


</div>

</div>

</div>


<script>


// ==============================
// LOGIN
// ==============================

const USER = "yossef";

const PASS = "01012800512";


function login(){

    let u =
    document.getElementById(
        "username"
    ).value.trim();

    let p =
    document.getElementById(
        "password"
    ).value.trim();


    if(
        u === USER &&
        p === PASS
    ){

        document.getElementById(
            "login"
        ).style.display = "none";


        document.getElementById(
            "system"
        ).style.display = "block";


        dashboard();


    }else{

        document.getElementById(
            "error"
        ).innerText =
        "ACCESS DENIED";

    }

}


// ==============================
// SHOW PASSWORD
// ==============================

function showPassword(){

    let p =
    document.getElementById(
        "password"
    );

    if(
        p.type === "password"
    ){

        p.type = "text";

    }else{

        p.type = "password";

    }

}


// ==============================
// LOGOUT
// ==============================

function logout(){

    document.getElementById(
        "system"
    ).style.display = "none";


    document.getElementById(
        "login"
    ).style.display = "block";


    document.getElementById(
        "password"
    ).value = "";

}


// ==============================
// DASHBOARD
// ==============================

function dashboard(){

document.getElementById(
"content"
).innerHTML = `

<h1>
WELCOME BACK, YOSSEF
</h1>

<p>
CYBER CONTROL CENTER
</p>


<div class="cards">


<div class="card">

<div class="small">
SYSTEM
</div>

<div class="number green">
ONLINE
</div>

</div>


<div class="card">

<div class="small">
CPU
</div>

<div class="number blue">
27%
</div>

</div>


<div class="card">

<div class="small">
MEMORY
</div>

<div class="number purple">
43%
</div>

</div>


<div class="card">

<div class="small">
NETWORK
</div>

<div class="number yellow">
82%
</div>

</div>


</div>


<div class="panel">

<h3>
LIVE SYSTEM LOG
</h3>

<pre
id="log"
class="terminal">
</pre>

</div>

`;


// Fake loading animation

let messages = [

"[SYSTEM] Initializing...",

"[SYSTEM] Loading modules...",

"[OK] Security module loaded",

"[OK] Local sandbox active",

"[OK] Dashboard loaded",

"[NETWORK] Real access disabled",

"[READY] Simulation online"

];


let i = 0;


function writeLog(){

    if(i < messages.length){

        document.getElementById(
            "log"
        ).innerText +=
        messages[i] + "\n";

        i++;

        setTimeout(
            writeLog,
            350
        );

    }

}


writeLog();

}


// ==============================
// TERMINAL
// ==============================

function terminal(){

document.getElementById(
"content"
).innerHTML = `

<h1>
TERMINAL
</h1>

<p>
LOCAL SIMULATION TERMINAL
</p>


<div class="panel">

<pre
id="term"
class="terminal">
YOSSEF@SYSTEM:~$ help

Commands:

help
status
scan
network
clear
exit

YOSSEF@SYSTEM:~$
</pre>


<input
id="command"
placeholder="Type command..."
onkeydown="runCommand(event)"
>

</div>

`;

}


// ==============================
// TERMINAL COMMANDS
// ==============================

function runCommand(e){

    if(
        e.key !== "Enter"
    ){

        return;

    }


    let input =
    document.getElementById(
        "command"
    );


    let terminal =
    document.getElementById(
        "term"
    );


    let cmd =
    input.value.trim().toLowerCase();


    input.value = "";


    if(cmd === "clear"){

        terminal.innerText =
        "YOSSEF@SYSTEM:~$ ";

        return;

    }


    terminal.innerText +=
    "\nYOSSEF@SYSTEM:~$ " +
    cmd +
    "\n";


    if(cmd === "help"){

        terminal.innerText +=
        "help | status | scan | network | clear | exit\n";

    }

    else if(cmd === "status"){

        terminal.innerText +=
        "[OK] SYSTEM ONLINE\n";

    }

    else if(cmd === "scan"){

        terminal.innerText +=
        "[SIMULATION] Scan complete.\n";

    }

    else if(cmd === "network"){

        terminal.innerText +=
        "[SIMULATION] Network map loaded.\n";

    }

    else if(cmd === "exit"){

        dashboard();

    }

    else{

        terminal.innerText +=
        "[SIMULATION] Unknown command.\n";

    }

}


// ==============================
// NETWORK
// ==============================

function network(){

let nodes = "";

for(
    let i = 1;
    i <= 12;
    i++
){

    nodes +=
    "NODE-" +
    String(i).padStart(2,"0") +
    "    SIMULATED / ONLINE\n";

}


document.getElementById(
"content"
).innerHTML = `

<h1>
NETWORK MAP
</h1>

<p>
FICTIONAL NETWORK TOPOLOGY
</p>


<div class="panel">

<pre class="terminal">
${nodes}
</pre>

</div>

`;

}


// ==============================
// SCAN
// ==============================

function scan(){

document.getElementById(
"content"
).innerHTML = `

<h1>
SYSTEM SCAN
</h1>

<p>
SAFE SIMULATION
</p>


<div class="panel">

<pre
id="scanText"
class="terminal">
READY...
</pre>


<div class="scanbar">

<div
id="scanFill"
class="scanfill">
</div>

</div>


<button onclick="startScan()">

&gt; START SIMULATION SCAN

</button>


</div>

`;

}


// ==============================
// SCAN ANIMATION
// ==============================

function startScan(){

let progress = 0;


let timer =
setInterval(

function(){

    progress += 5;


    document.getElementById(
        "scanFill"
    ).style.width =
    progress + "%";


    document.getElementById(
        "scanText"
    ).innerText =
    "SIMULATION SCAN: " +
    progress +
    "%";


    if(
        progress >= 100
    ){

        clearInterval(timer);


        document.getElementById(
            "scanText"
        ).innerText =
        "SIMULATION COMPLETE\n\n" +
        "No real targets accessed.";

    }

},
80
);

}


// ==============================
// SECURITY
// ==============================

function security(){

document.getElementById(
"content"
).innerHTML = `

<h1>
SECURITY CENTER
</h1>

<p>
LOCAL SIMULATION SECURITY
</p>


<div class="panel">


<div class="status">

<span>
FIREWALL
</span>

<span class="online">
ACTIVE
</span>

</div>


<div class="status">

<span>
SANDBOX
</span>

<span class="online">
ACTIVE
</span>

</div>


<div class="status">

<span>
REAL NETWORK
</span>

<span class="disabled">
DISABLED
</span>

</div>


<div class="status">

<span>
REAL TARGETS
</span>

<span class="disabled">
DISABLED
</span>

</div>


</div>

`;

}


// ==============================
// SYSTEM INFO
// ==============================

function systemInfo(){

document.getElementById(
"content"
).innerHTML = `

<h1>
SYSTEM INFO
</h1>


<div class="panel">

<pre class="terminal">

SYSTEM NAME : YOSSEF SYSTEM

VERSION     : 5.0

MODE        : LOCAL SIMULATOR

STATUS      : ONLINE

SECURITY    : ACTIVE

NETWORK     : SIMULATION ONLY

</pre>

</div>

`;

}

</script>

</body>

</html>
