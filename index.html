<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YOSSEF WALED // V10000000000</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}

body{
  background:#010208;
  color:#fff;
  font-family:monospace;
}

.app{
  position:relative;
  width:100%;
  height:100%;
  max-width:450px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#101b4a 0,#050714 30%,#010208 78%);
}

/* GRID */
.app:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(#00eaff10 1px,transparent 1px),
    linear-gradient(90deg,#00eaff10 1px,transparent 1px);
  background-size:28px 28px;
  animation:grid 7s linear infinite;
}

@keyframes grid{
  to{background-position:28px 28px}
}

/* SCAN */
.scan{
  position:absolute;
  width:100%;
  height:2px;
  background:#00eaff;
  box-shadow:0 0 20px #00eaff;
  opacity:.35;
  animation:scan 2.8s linear infinite;
  z-index:10;
}

@keyframes scan{
  from{top:-5%}
  to{top:105%}
}

/* TOP */
.top{
  position:absolute;
  top:15px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  color:#607d8b;
  font-size:8px;
  letter-spacing:2px;
  z-index:5;
}

/* LOGO */
.logo{
  position:absolute;
  top:85px;
  width:100%;
  text-align:center;
  z-index:4;
}

.logo .y{
  font-size:45px;
  font-weight:900;
  letter-spacing:6px;
  color:#00eaff;
  text-shadow:
    0 0 5px #00eaff,
    0 0 18px #00eaff,
    0 0 40px #00eaff;
  animation:float 2s ease-in-out infinite;
}

.logo .w{
  margin-top:5px;
  font-size:35px;
  font-weight:900;
  letter-spacing:8px;
  color:#a66cff;
  text-shadow:
    0 0 5px #a66cff,
    0 0 18px #a66cff,
    0 0 40px #a66cff;
  animation:float2 2s ease-in-out infinite;
}

@keyframes float{
  50%{transform:translateY(-5px)}
}

@keyframes float2{
  50%{transform:translateY(5px)}
}

/* CORE */
.core{
  position:absolute;
  top:205px;
  left:50%;
  transform:translateX(-50%);
  width:170px;
  height:170px;
  border-radius:50%;
  border:1px solid #00eaff66;
  box-shadow:
    0 0 30px #00eaff22,
    inset 0 0 30px #7c4dff22;
}

.core:before{
  content:"";
  position:absolute;
  inset:20px;
  border:1px solid #a66cff66;
  border-radius:50%;
}

.core:after{
  content:"";
  position:absolute;
  inset:43px;
  border:1px solid #00eaff77;
  border-radius:50%;
}

.radar{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(
    transparent 0deg,
    #00eaff88 45deg,
    transparent 70deg
  );
  animation:spin 1.8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.dot{
  position:absolute;
  width:7px;
  height:7px;
  background:#00ff9d;
  border-radius:50%;
  box-shadow:0 0 15px #00ff9d;
  top:30px;
  left:105px;
  animation:blink .7s infinite alternate;
}

@keyframes blink{
  to{opacity:.2}
}

/* STATUS */
.status{
  position:absolute;
  top:390px;
  left:0;
  right:0;
  text-align:center;
  color:#00eaff;
  font-size:9px;
  letter-spacing:3px;
}

/* CARDS */
.cards{
  position:absolute;
  top:425px;
  left:14px;
  right:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.card{
  padding:9px;
  border:1px solid #153848;
  border-radius:9px;
  background:#050d17cc;
  box-shadow:inset 0 0 15px #00eaff08;
}

.card small{
  color:#607d8b;
  font-size:7px;
  letter-spacing:1px;
}

.val{
  margin-top:5px;
  color:#00eaff;
  font-size:16px;
  text-shadow:0 0 8px #00eaff;
}

.bar{
  height:3px;
  background:#12202a;
  margin-top:6px;
  overflow:hidden;
}

.bar i{
  display:block;
  width:70%;
  height:100%;
  background:linear-gradient(90deg,#00eaff,#a66cff);
  animation:bar 1.5s infinite alternate;
}

@keyframes bar{
  from{width:25%}
  to{width:95%}
}

/* TERMINAL */
.terminal{
  position:absolute;
  left:14px;
  right:14px;
  bottom:55px;
  height:95px;
  border:1px solid #173746;
  border-radius:9px;
  background:#01050bd9;
  padding:8px;
  overflow:hidden;
  font-size:7px;
}

.line{
  margin:3px 0;
  color:#49ffad;
}

.line span{
  color:#00eaff;
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:13px;
  left:0;
  right:0;
  text-align:center;
  color:#30424d;
  font-size:6px;
  letter-spacing:2px;
}

/* GLITCH */
.glitch{
  animation:glitch .1s 8;
}

@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(4px,-2px)}
  50%{transform:translate(-5px,2px)}
  75%{transform:translate(3px,1px)}
  100%{transform:translate(0)}
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  z-index:30;
  pointer-events:none;
}

.flash.on{
  animation:flash .4s;
}

@keyframes flash{
  0%{opacity:0}
  15%{opacity:.9}
  100%{opacity:0}
}

/* FINAL */
.final{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:#010208f5;
  z-index:50;
}

.final.show{
  display:flex;
}

.final .small{
  color:#8f82ff;
  font-size:9px;
  letter-spacing:5px;
}

.final h1{
  margin:18px 0 5px;
  font-size:48px;
  letter-spacing:6px;
  color:#00eaff;
  text-shadow:
    0 0 8px #00eaff,
    0 0 25px #00eaff,
    0 0 50px #a66cff;
  animation:finalPulse 1s infinite alternate;
}

.final h2{
  margin:0;
  font-size:30px;
  letter-spacing:8px;
  color:#a66cff;
  text-shadow:
    0 0 8px #a66cff,
    0 0 25px #a66cff;
}

.final .line{
  width:240px;
  height:1px;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
  margin:20px;
}

.final p{
  color:#607d8b;
  font-size:8px;
  letter-spacing:3px;
}

@keyframes finalPulse{
  from{transform:scale(.96)}
  to{transform:scale(1.05)}
}
</style>
</head>

<body>

<div class="app" id="app">

<div class="scan"></div>

<div class="top">
  <span>V10000000000 // CORE</span>
  <span id="time">00:00:00</span>
</div>

<div class="logo">
  <div class="y">YOSSEF</div>
  <div class="w">WALED</div>
</div>

<div class="core">
  <div class="radar"></div>
  <div class="dot"></div>
</div>

<div class="status" id="status">
  INITIALIZING ULTRA SYSTEM...
</div>

<div class="cards">

  <div class="card">
    <small>CPU PERFORMANCE</small>
    <div class="val" id="cpu">--%</div>
    <div class="bar"><i></i></div>
  </div>

  <div class="card">
    <small>MEMORY CORE</small>
    <div class="val" id="ram">--%</div>
    <div class="bar"><i></i></div>
  </div>

  <div class="card">
    <small>ENERGY STATUS</small>
    <div class="val" id="bat">--%</div>
    <div class="bar"><i></i></div>
  </div>

  <div class="card">
    <small>NETWORK PING</small>
    <div class="val" id="ping">--ms</div>
    <div class="bar"><i></i></div>
  </div>

</div>

<div class="terminal" id="terminal"></div>

<div class="footer">
  VISUAL SIMULATION // NO REAL DEVICE DATA
</div>

<div class="flash" id="flash"></div>

<div class="final" id="final">
  <div class="small">FINAL SYSTEM STATUS</div>
  <div class="line"></div>
  <h1>YOSSEF</h1>
  <h2>WALED</h2>
  <div class="line"></div>
  <p>DIAGNOSTIC COMPLETE // SYSTEM VERIFIED</p>
</div>

</div>

<script>
const terminal=document.getElementById("terminal");
const app=document.getElementById("app");
const flash=document.getElementById("flash");
const final=document.getElementById("final");

const logs=[
"BOOT SEQUENCE STARTED...",
"LOADING ULTRA CORE...",
"INITIALIZING VISUAL ENGINE...",
"CHECKING SYSTEM MODULES...",
"ANALYZING PERFORMANCE...",
"NETWORK MODULE ONLINE...",
"SECURITY ENGINE READY...",
"RUNNING FINAL DIAGNOSTIC...",
"CORE STATUS: STABLE",
"FINAL VERIFICATION STARTED..."
];

let n=0;

function addLog(){
  if(n>=logs.length)return;

  const x=document.createElement("div");
  x.className="line";
  x.innerHTML='<span>[V10]</span> '+logs[n];

  terminal.appendChild(x);

  while(terminal.children.length>9)
    terminal.removeChild(terminal.firstChild);

  n++;
  setTimeout(addLog,550);
}

function update(){
  document.getElementById("cpu").textContent=
    Math.floor(30+Math.random()*65)+"%";

  document.getElementById("ram").textContent=
    Math.floor(40+Math.random()*50)+"%";

  document.getElementById("bat").textContent=
    Math.floor(70+Math.random()*30)+"%";

  document.getElementById("ping").textContent=
    Math.floor(15+Math.random()*70)+"ms";
}

function clock(){
  document.getElementById("time").textContent=
    new Date().toLocaleTimeString("en-US",{hour12:false});
}

setInterval(update,700);
setInterval(clock,1000);

update();
clock();
addLog();

setTimeout(()=>{
  document.getElementById("status").textContent=
    "FINAL VERIFICATION...";
  app.classList.add("glitch");
  flash.classList.add("on");

  setTimeout(()=>{
    app.classList.remove("glitch");
    flash.classList.remove("on");
  },500);
},6000);

setTimeout(()=>{
  final.classList.add("show");
},8000);
</script>

</body>
</html>
